<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Bell Stopwatch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Desk Bell Stopwatch</h1>
      <p class="display" id="display">00:00.0</p>

      <div class="controls">
        <button id="startPauseBtn" type="button">Start</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <form id="timeForm" class="time-form">
        <label for="secondsInput">
          Bell time (seconds)
          <input
            id="secondsInput"
            name="seconds"
            type="number"
            min="0.1"
            step="0.1"
            placeholder="e.g. 5.0"
            aria-label="Bell time in seconds"
            required
          />
        </label>
        <button type="submit">Add time</button>
      </form>

      <ul id="timesList" class="times-list" aria-label="Stopwatch times"></ul>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
